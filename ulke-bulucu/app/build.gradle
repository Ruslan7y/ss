plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruslan.ulkebulucu'
    compileSdk 34

    defaultConfig {
        applicationId "com.ruslan.ulkebulucu"
        minSdk 30          // Android 11 ve üstü (ekran görüntüsü özelliği için gerekli)
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Sabit imza: sonraki sürümler eskisinin üzerine kurulur
    signingConfigs {
        sabit {
            storeFile file('imza.jks')
            storePassword 'ulke2026'
            keyAlias 'ulke'
            keyPassword 'ulke2026'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sabit
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
