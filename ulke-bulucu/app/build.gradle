plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ruslan.ulkebulucu'
    compileSdk 34

    defaultConfig {
        applicationId "com.ruslan.ulkebulucu"
        minSdk 30          // Android 11 ve üstü (ekran görüntüsü özelliği için gerekli)
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
