name: Zirve APK

on:
  push:
    paths:
      - "zirve-festivali/**"
      - ".github/workflows/zirve.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zirve-festivali
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZirveFestivali-APK
          path: zirve-festivali/app/build/outputs/apk/debug/app-debug.apk
